<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#070907">
<title>Caisse Chlorophylle Night</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* Couleurs (logo Chlorophylle Night : noir, or, feuillage). --acc = couleur de la caisse ouverte. */
:root{--bg:#070907;--surface:#111611;--surface2:#182018;--soft:#1E271E;--line:#263126;--line2:#3A473A;--text:#F2EFE6;--muted:#A9B0A2;--faint:#7E877B;
--gold:#CDA66B;--gold-l:#E6C792;--leaf:#6FBF77;--mint:#7CCFC4;--red:#EE8571;--amber:#E7AE5C;--on-acc:#0B0D08;--warn-bg:#3A2619;--warn-text:#F2BC8C;
--acc:var(--gold);color-scheme:dark}
[data-caisse="tickets"]{--acc:var(--leaf)}
[data-caisse="boissons"]{--acc:var(--mint)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Montserrat","Segoe UI",Roboto,system-ui,sans-serif;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;color:var(--text)}
button:active{transform:scale(.98)}
button:disabled{opacity:.4;cursor:not-allowed}
input{font-family:inherit;background:var(--surface);color:var(--text)}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
#app{height:100%;position:relative;overflow:hidden;user-select:none}
.full{height:100%;display:flex;flex-direction:column}
.neon{color:#fff;text-shadow:0 0 6px rgba(255,255,255,.55),0 0 18px rgba(205,166,107,.35);letter-spacing:.14em;text-transform:uppercase;font-weight:300}
.btn{height:54px;padding:0 24px;border-radius:12px;font-size:17px;font-weight:700;border:1px solid var(--line2);background:var(--surface2)}
.btn-primary{border:none;background:var(--acc);color:var(--on-acc);font-weight:800}
.btn-link{border:none;background:transparent;color:var(--gold-l);font-weight:700;text-decoration:underline;font-size:15px;height:40px}
.btn-danger{border:none;background:transparent;color:var(--red);font-weight:700}
.sub{font-size:15px;color:var(--muted)}
.iconbtn{width:48px;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* Accueil */
.home{height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:22px;padding:28px 16px 32px;background:radial-gradient(ellipse at 50% 0%,#14211a 0%,var(--bg) 62%)}
.home .logo{width:min(300px,52vw);border-radius:16px;box-shadow:0 0 40px rgba(205,166,107,.12)}
.night{font-size:15px;color:var(--gold-l);font-weight:700;letter-spacing:.06em}
.ctiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;width:min(1000px,100%)}
.ctile{position:relative;min-height:190px;border:1px solid var(--line2);border-radius:20px;background:linear-gradient(160deg,var(--surface2),var(--surface));display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px;text-align:left;overflow:hidden}
.ctile::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--acc)}
.ctile svg{color:var(--acc)}
.ctile .t{font-size:28px;font-weight:800;letter-spacing:.04em}
.ctile .d{font-size:15px;color:var(--muted);line-height:1.35}
.ctile .k{font-size:15px;font-weight:800;color:var(--acc)}
.homelinks{display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:center;align-items:center}
.homebtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* En-tête caisse */
.header{height:70px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.header img{height:52px;border-radius:8px;cursor:pointer}
.seg{display:flex;gap:6px;background:var(--bg);padding:5px;border-radius:12px;border:1px solid var(--line)}
.seg button{height:44px;padding:0 18px;border:none;border-radius:9px;background:transparent;font-size:16px;font-weight:700;white-space:nowrap}
.seg button.on{background:var(--acc);color:var(--on-acc);font-weight:800}
.seg.cs button[data-v="entrees"].on{background:var(--gold)}
.seg.cs button[data-v="tickets"].on{background:var(--leaf)}
.seg.cs button[data-v="boissons"].on{background:var(--mint)}
.homebtn{height:48px;padding:0 16px;display:flex;align-items:center;gap:8px;flex-shrink:0;font-size:16px}
.ctitle{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;color:var(--acc);white-space:nowrap}
.phone .homebtn{height:44px;padding:0 12px}
.phone .ctitle{font-size:19px}
.hdate{font-size:14px;font-weight:700;color:var(--muted);text-align:right;line-height:1.3}
.body{flex:1;display:flex;min-height:0}
.main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px 18px;min-width:0;overflow-y:auto}
.strip{display:flex;flex-wrap:wrap;gap:10px}
.stat{flex:1;min-width:130px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;font-weight:800;color:var(--acc)}
.stat span{font-size:13px;color:var(--muted);font-weight:700}

/* Tuiles produits */
.cats{display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.cat{height:48px;padding:0 20px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px;font-weight:700}
.cat.on{border-color:var(--acc);background:var(--acc);color:var(--on-acc);font-weight:800}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;align-content:start}
.prod{height:118px;border:1px solid var(--line2);border-radius:14px;background:var(--surface2);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:12px 14px;text-align:left;position:relative}
.prod .m{font-size:18px;font-weight:800;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod .p{font-size:18px;font-weight:800;color:var(--acc)}
.prod .p small{font-size:13px;color:var(--faint);font-weight:700;margin-left:6px}
.prod.btl{background:linear-gradient(160deg,#20281c,var(--surface2));border-color:#4a5638}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--on-acc);background:var(--gold);border-radius:6px;padding:2px 6px;margin-top:4px}
.bigtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.bigt{min-height:150px;border:1px solid var(--line2);border-radius:18px;background:var(--surface2);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:18px 20px;text-align:left}
.bigt .m{font-size:26px;font-weight:800}
.bigt .p{font-size:30px;font-weight:800;color:var(--acc)}
.bigt.scan{grid-column:1/-1;min-height:120px;flex-direction:row;align-items:center;justify-content:flex-start;gap:18px;border:2px dashed var(--acc);background:var(--surface)}
.bigt.scan svg{color:var(--acc);flex-shrink:0}
.bigt.scan .m{font-size:24px}

/* Panier / commande */
.cart{width:380px;flex-shrink:0;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line)}
.cart-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 6px}
.cart-h h2{margin:0;font-size:22px;font-weight:800}
.lines{flex:1;overflow-y:auto;padding:0 10px}
.empty{padding:40px 12px;text-align:center;color:var(--faint);font-size:16px}
.line{display:flex;align-items:center;gap:8px;padding:10px 6px;border-bottom:1px solid var(--soft)}
.line .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.line .n{font-size:16px;font-weight:700}
.line .u{font-size:13px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:42px;height:42px;border:1px solid var(--line2);border-radius:10px;background:var(--surface2);font-size:22px;font-weight:700}
.qty span{width:28px;text-align:center;font-size:18px;font-weight:800}
.line .t{width:82px;text-align:right;font-size:17px;font-weight:800}
.cart-f{padding:12px 18px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.small{height:40px;padding:0 14px;border:1px solid var(--line2);border-radius:10px;background:var(--surface2);font-size:15px;font-weight:700}
.total{font-size:34px;font-weight:800}
.pay{height:68px;border:none;border-radius:14px;background:var(--acc);color:var(--on-acc);font-size:24px;font-weight:800}
.barrer{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0}
.barrer b{font-size:56px;line-height:1;color:var(--acc);font-weight:800}
.barrer span{font-size:15px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}

/* Tickets */
.tk{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-size:17px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tkbig{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line2)}
.tkbig .n{font-size:58px;font-weight:800;line-height:1;color:var(--acc)}
.tkbig .l{font-size:16px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tkbig .s{font-size:20px;font-weight:800}
.tkbig .e{font-size:34px;font-weight:800;margin-top:2px}
.card18{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;width:100%;max-width:250px}
.card18 i{aspect-ratio:1;border-radius:5px;border:1px solid var(--line2);background:var(--bg)}
.card18 i.on{background:var(--acc);border-color:var(--acc)}
.cards-more{font-size:14px;font-weight:700;color:var(--muted)}
.tkbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tkbtns button{height:56px;border-radius:14px;border:1px solid var(--line2);background:var(--surface2);font-size:18px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tkbtns button small{font-size:12px;color:var(--muted);font-weight:700}
.tkbtns button.plus{border-color:var(--acc);color:var(--acc)}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kp button{height:52px;border-radius:12px;border:1px solid var(--line2);background:var(--surface2);font-size:24px;font-weight:800}
.kpdisp{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 16px;border-radius:12px;background:var(--bg);border:1px solid var(--line2);min-height:64px}
.kpdisp b{font-size:34px;font-weight:800}
.kpdisp span{font-size:15px;color:var(--muted);font-weight:700;text-align:right}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{flex:1;min-width:60px;height:46px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);font-size:16px;font-weight:800}
.hint{padding:10px 14px;border-radius:12px;background:var(--soft);font-size:15px;line-height:1.4;font-weight:600}

/* Historique / bilan */
.hist{flex:1;overflow-y:auto;padding:20px 24px}
.hist h2{margin:0;font-size:24px;font-weight:800}
.hhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:12px}
.hdays{display:flex;flex-wrap:wrap;gap:6px}
.choice{height:40px;padding:0 14px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);font-size:15px;font-weight:700}
.choice.on{border:2px solid var(--acc);color:var(--acc);font-weight:800}
.hsum{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:10px;font-size:17px}
.table{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sale{display:grid;grid-template-columns:80px minmax(0,1fr) 200px 110px 110px;gap:14px;align-items:start;padding:12px 16px;border-bottom:1px solid var(--soft)}
.sale .h{font-size:19px;font-weight:800}
.sale .l{display:flex;flex-direction:column;gap:3px;font-size:16px}
.sale .pm{font-size:15px;color:var(--muted);font-weight:600}
.sale .tt{font-size:19px;font-weight:800;text-align:right}
.sale .act{display:flex;justify-content:flex-end}
.sale .act .btn{height:40px;padding:0 12px;font-size:15px}
.sale.cancelled .h,.sale.cancelled .l>span:not(.annul),.sale.cancelled .pm,.sale.cancelled .tt{opacity:.45;text-decoration:line-through}
.sale .annul{color:var(--red);font-weight:700;font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--acc);margin-left:6px}
.pill.warn{color:var(--amber)}
.bilan{flex:1;overflow-y:auto;padding:20px 24px 40px;display:flex;flex-direction:column;gap:18px}
.bilan>*{width:100%;max-width:1100px;margin:0 auto}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi b{font-size:30px;font-weight:800}
.kpi small{font-size:13px;color:var(--faint);font-weight:600}
.sect h3{margin:0 0 10px;font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px}
.sect h3 i{width:10px;height:22px;border-radius:3px;display:inline-block}
.btable{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:15px}
.btable th,.btable td{padding:9px 12px;border-bottom:1px solid var(--soft);text-align:left}
.btable th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--surface2)}
.btable td.n,.btable th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.btable tr.cat td{background:var(--soft);font-weight:800}
.bar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--mint)}
.hours{display:flex;align-items:flex-end;gap:6px;height:180px;padding:12px 12px 0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow-x:auto}
.hcol{flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.hcol .bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.hcol .bars i{width:42%;border-radius:4px 4px 0 0;min-height:2px}
.hcol span{font-size:12px;color:var(--muted);font-weight:700;padding-bottom:6px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);font-weight:700;margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.srcs{font-size:14px;color:var(--muted);line-height:1.5}

/* Menu, fenêtres */
.menu-back{position:absolute;inset:0;z-index:4}
.menu{position:absolute;top:74px;right:16px;width:min(480px,94vw);background:var(--surface);border:1px solid var(--line2);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.6);padding:14px;display:flex;flex-direction:column;gap:8px;z-index:5;max-height:calc(100% - 90px);overflow-y:auto}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mtile{min-height:108px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);text-align:left;font-size:16px}
.mtile svg{color:var(--gold)}
.mt-l{font-weight:800;line-height:1.2}
.mt-s{font-size:13px;font-weight:600;color:var(--muted);line-height:1.25}
.mgroup{font-size:13px;font-weight:800;color:var(--muted);padding:2px 4px 0}
.meta{padding:8px 4px 0;font-size:13px;color:var(--faint);border-top:1px solid var(--line)}
.toast{position:absolute;left:50%;top:80px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:16px 26px;border-radius:14px;font-size:18px;font-weight:700;z-index:30;max-width:90vw;text-align:center}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal{width:min(560px,96vw);max-height:96%;overflow-y:auto;background:var(--surface);border:1px solid var(--line2);border-radius:18px;padding:24px 26px;display:flex;flex-direction:column;gap:16px}
.modal h2{margin:0;font-size:24px;font-weight:800}
label.f{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:700;color:var(--muted)}
label.f input{height:52px;border:1px solid var(--line2);border-radius:10px;padding:0 14px;font-size:20px;font-weight:700;width:100%}
.actions{display:flex;gap:12px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mode{height:58px;border:1px solid var(--line2);border-radius:12px;background:var(--surface2);font-size:19px;font-weight:700}
.mode.on{border:2px solid var(--acc);background:var(--acc);color:var(--on-acc);font-weight:800}
.bills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bill{height:58px;border:1px solid var(--line2);border-radius:12px;background:var(--bg);font-size:20px;font-weight:800}
.bill.exact{font-size:14px;color:var(--acc)}
.result{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:14px;background:var(--soft)}
.result.ko{background:var(--warn-bg);color:var(--warn-text)}
.result b{font-size:19px}
.result span{font-size:32px;font-weight:800}
.paybody{min-height:330px;display:flex;flex-direction:column;gap:14px}
.paybody.mid{justify-content:center}
.memwarn{display:block;width:100%;flex-shrink:0;border:none;background:var(--warn-bg);color:var(--warn-text);font-size:15px;font-weight:700;padding:10px 16px;text-align:center}
.memgauge{display:flex;flex-direction:column;gap:6px;font-size:15px}
.memgauge .bar i{background:var(--leaf)}
.dayact{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}

/* Scanner */
.scanbox{position:relative;width:100%;aspect-ratio:4/3;max-height:52vh;border-radius:16px;overflow:hidden;background:#000;border:2px solid var(--line2)}
#camslot{position:absolute;inset:0}
#camslot video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:16% 24%;border:3px solid rgba(255,255,255,.85);border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.25);pointer-events:none}
.scanmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;font-size:18px;font-weight:700}
.scanmsg.ok{background:rgba(20,90,40,.92)}
.scanmsg.dup{background:rgba(140,30,25,.94)}
.scanmsg.info{background:rgba(10,12,10,.9);color:var(--muted)}
.scanmsg big{font-size:36px;font-weight:800;color:#fff}
.scanmsg code{font-size:15px;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:8px;word-break:break-all;color:#fff}
.bigok{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.bigok b{font-size:110px;line-height:1;color:var(--acc);font-weight:800}
.bigok span{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
@media (max-width:1100px){.cart{width:330px}.sale{grid-template-columns:70px minmax(0,1fr) 150px 90px 100px}.header .hdate{display:none}}

/* ---------- Vue smartphone ---------- */
.phone .header{height:58px;gap:8px;padding:0 10px}
.phone .header img{height:40px}
.phone .seg button{height:40px;padding:0 10px;font-size:14px}
.phone .seg{padding:4px;gap:4px}
.subbar{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
.phone .body{flex-direction:column;position:relative}
.phone .main{padding:12px 12px 92px;gap:12px}
.phone .cats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px 2px;gap:8px}
.phone .cats::-webkit-scrollbar{display:none}
.phone .cat{flex-shrink:0;height:42px;padding:0 14px;font-size:15px}
.phone .products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.phone .prod{height:104px;padding:10px 12px}
.phone .prod .m{font-size:16px}
.phone .bigtiles{gap:10px}
.phone .bigt{min-height:120px;padding:14px}
.phone .bigt .m{font-size:20px}.phone .bigt .p{font-size:24px}
.phone .strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.phone .stat{min-width:0;padding:8px}.phone .stat b{font-size:22px}.phone .stat span{font-size:11px}
.cartbar{position:absolute;left:12px;right:12px;bottom:12px;height:62px;border:none;border-radius:16px;background:var(--acc);color:var(--on-acc);display:flex;align-items:center;gap:12px;padding:0 18px;font-size:17px;font-weight:800;z-index:3;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.cartbar .n{background:var(--on-acc);color:var(--acc);min-width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:15px;padding:0 8px}
.cartbar .tt{margin-left:auto;font-size:20px}
.phone .cart{position:absolute;inset:0;width:auto;border-left:none;z-index:4;display:none}
.phone .cart.open{display:flex}
.back{height:40px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:var(--surface2);font-size:15px;font-weight:700}
.phone .tk{grid-template-columns:1fr}
.phone .tkbig .n{font-size:60px}
.phone .hist,.phone .bilan{padding:14px 12px}
.phone .sale{grid-template-columns:1fr auto;grid-template-areas:"h tt" "l l" "pm act";gap:4px 12px;padding:12px 14px}
.phone .sale .h{grid-area:h;font-size:17px}.phone .sale .tt{grid-area:tt}.phone .sale .l{grid-area:l;font-size:15px}.phone .sale .pm{grid-area:pm;font-size:13px}.phone .sale .act{grid-area:act}
.phone .menu{top:62px;left:8px;right:8px;width:auto}
.phone .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.phone .overlay{padding:0;align-items:flex-end}
.phone .modal{width:100% !important;max-height:94%;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.phone .modal.paymodal{height:100%;max-height:100%;border-radius:0}
.phone .paymodal .actions{margin-top:auto}
.phone .actions .btn{flex:1}
.phone .ctiles{grid-template-columns:1fr;gap:12px}
.phone .ctile{min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:16px;padding:16px 16px 16px 22px}
.phone .bgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.phone .kpi{padding:10px 12px}.phone .kpi b{font-size:24px}.phone .kpi span{font-size:11px}
.phone .bilan .actions .btn{flex:1 1 100%;height:auto;min-height:52px;padding:8px 14px}
.phone .ctile .t{font-size:22px}
.phone .ctile .d{display:none}
.phone .home .logo{width:min(220px,60vw)}
.phone .toast{top:64px;font-size:16px}
.phone .btable{font-size:14px}.phone .btable th,.phone .btable td{padding:8px}
.phone .hide-phone{display:none}
.phone:not(.framed) #app{padding-top:env(safe-area-inset-top,0px)}
</style>
</head>

   Rien n'est envoyé sans un appui sur « Envoyer ». */
var GH_REPO = 'scraper147/ventes';   // vide = fonction masquée

var CLE_CHIFFREE = {"v":1,"kdf":"PBKDF2-SHA256","iter":600000,"salt":"5IZtB3dQO9ai0MwpOlomjg==","iv":"86amDE8FvOCiCDGl","data":"wOVUYuUolCQQadXsUb0ROhr0jWbh4xUYwGzesbv/g+vYObhfjXzhgVcZagBTguF0pvFyOU+HmRJZdfwh2Iz6obVMBltBCbmY7uh2G+TLtgbnHsfdtD/X2bXPdRnYoP1uJwnCOwc0nXpq8TIEmw=="};

/* ---------- Liste des billets de prévente vendus (facultative) ----------
   Chargée depuis le dossier « preventes/ » du dépôt privé des ventes (tous les fichiers du dossier),
   ou importée depuis un fichier. N'importe quel format convient (CSV, JSON, texte, export de la billetterie) :
   on y relève tous les codes de 32 caractères (0-9 a-f). Gardée sur l'appareil, utilisable hors ligne.
   Jamais dans le dépôt public de l'app : la liste permettrait de fabriquer de faux billets valides. */
var PLIST_KEY = STORE_KEY + '-preventes';
var PL_DOSSIER = 'preventes';
var PLIST = {};
function plistLoad() {
  try { PLIST = JSON.parse(localStorage.getItem(PLIST_KEY)) || {}; } catch (e) { PLIST = {}; }
  PLIST.set = {}; (PLIST.codes || []).forEach(function (c) { PLIST.set[c] = 1; });
}
plistLoad();
function plistSave(codes, source) {
  var uniq = {}; codes.forEach(function (c) { uniq[c.toLowerCase()] = 1; });
  var data = { codes: Object.keys(uniq), source: source, charge: isoLocal(new Date()) };
  try { localStorage.setItem(PLIST_KEY, JSON.stringify(data)); } catch (e) { toast('Mémoire pleine : liste non enregistrée'); return false; }
  plistLoad(); refreshUsage(); return true;
}
function extractCodes(txt) { return String(txt || '').match(/\b[0-9a-fA-F]{32}\b/g) || []; }
function plistLabel() {
  if (!PLIST.codes) return CATALOGUE.modeleQR ? 'Pas de liste : seul le format du QR est contrôlé' : 'Pas de liste ni de modèle : tout QR est accepté';
  return plural(PLIST.codes.length, 'billet') + ' dans la liste (' + esc(PLIST.source || '') + ', ' + frDate(PLIST.charge) + ' à ' + hhmm(PLIST.charge) + ')';
}
async function plistFromGitHub() {
  if (S.plBusy || !ghReady()) return;
  S.plBusy = true; S.plMsg = { ok: null, text: 'Chargement depuis GitHub…' }; render();
  try {
    var r = await ghApi('GET', ghUrl(PL_DOSSIER));
    if (r.status === 404) throw 'vide';
    if (!r.ok) throw r.status;
    var files = (await r.json()).filter(function (f) { return f.type === 'file'; }), codes = [], names = [];
    for (var i = 0; i < files.length; i++) {
      var fr = await ghApi('GET', ghUrl(files[i].path));
      if (!fr.ok) throw fr.status;
      var meta = await fr.json(), txt;
      if (meta.content) txt = utf8b64(meta.content);
      else if (meta.download_url) { var raw = await fetch(meta.download_url); txt = await raw.text(); } // gros fichier (> 1 Mo)
      var found = extractCodes(txt);
      if (found.length) { codes = codes.concat(found); names.push(files[i].name); }
    }
    if (!codes.length) throw 'aucun';
    if (plistSave(codes, 'GitHub ' + PL_DOSSIER + '/' + (names.length > 1 ? ' (' + names.length + ' fichiers)' : names[0])))
      S.plMsg = { ok: true, text: plural(PLIST.codes.length, 'billet') + ' chargé' + (PLIST.codes.length > 1 ? 's' : '') + ' depuis ' + names.join(', ') + '.' };
  } catch (e) {
    S.plMsg = { ok: false, text: e === 'vide' ? 'Le dossier « ' + PL_DOSSIER + ' » n’existe pas dans le dépôt des ventes.'
      : e === 'aucun' ? 'Aucun code de billet (32 caractères 0-9 a-f) trouvé dans le dossier « ' + PL_DOSSIER + ' ».'
      : ghError(typeof e === 'number' ? e : 0).replace('d’écrire dans', 'de lire') };
  } finally { S.plBusy = false; render(); }
}
document.getElementById('plistfile').addEventListener('change', function (e) {
  var files = Array.prototype.slice.call(e.target.files || []); if (!files.length) return;

    var rd = new FileReader();
    rd.onload = function () {
      codes = codes.concat(extractCodes(rd.result));
      if (++done === files.length) {
        if (!codes.length) S.plMsg = { ok: false, text: 'Aucun code de billet (32 caractères 0-9 a-f) trouvé dans ' + (files.length > 1 ? 'ces fichiers' : 'ce fichier') + '.' };
        else if (plistSave(codes, files.length > 1 ? files.length + ' fichiers' : 'fichier ' + files[0].name)) S.plMsg = { ok: true, text: plural(PLIST.codes.length, 'billet') + ' importé' + (PLIST.codes.length > 1 ? 's' : '') + '.' };
        render();
      }
    };
    rd.readAsText(f);
  });
});

}

/* ---------- Caisse 3 : Boissons ---------- */
function vBoissons() {
  var cats = CATALOGUE.boissons, cat = cats.filter(function (k) { return k.id === S.bcat; })[0] || cats[0], pc = PC(), tot = cartBCases();
  var html = '<div class="body"><div class="main"><div class="cats">' +

        (p.format === 'bouteille' ? '<span class="tag">Bouteille</span>' : '') + '</div><span class="p">' + plural(p.cases, 'case') + '<small>' + money(p.cases * pc) + '</small></span></button>';

/* ---------- Historique ---------- */
function nightsList(extra) {
  var t = tonight(), ds = Object.keys(S.nights).filter(function (d) { return S.nights[d] && S.nights[d].length; });
  (extra || []).forEach(function (d) { if (ds.indexOf(d) < 0) ds.push(d); });
  if (ds.indexOf(t) < 0) ds.push(t);
  return ds.sort().reverse().slice(0, 7);
}
function payText(p) { return p.mode === 'cash' ? 'Cash' : p.mode === 'bancontact' ? 'Bancontact' : 'Mixte · cash ' + money(p.cash) + ' + BC ' + money(p.bancontact); }
function vHist() {
  var days = nightsList(), night = days.indexOf(S.histNight) >= 0 ? S.histNight : tonight();
  var all = recs(night).filter(function (r) { return r.caisse === S.caisse; }), ok = valid(all), nAnn = all.length - ok.length;
  var html = '<div class="hist"><div class="hhead"><h2>' + CAISSES[S.caisse].nom + ' · ' + nightLabel(night).toLowerCase() + '</h2>' +
    (days.length > 1 ? '<div class="hdays">' + days.map(function (d) { return '<button class="choice' + (d === night ? ' on' : '') + '" data-a="histNight" data-v="' + d + '">' + (d === tonight() ? 'Ce soir' : frDate(d).slice(0, 5)) + '</button>'; }).join('') + '</div>' : '') + '</div>';
  if (!all.length) return html + '<div class="empty" style="padding:60px">Rien d’enregistré pour cette soirée sur cet appareil</div></div>';
  var R = summarize(ok), sum;
  if (S.caisse === 'entrees') sum = (R.entrees.personnes + R.entrees.preventes) + ' entrées (' + R.entrees.personnes + ' payantes, ' + R.entrees.preventes + ' préventes) · ' + money(R.entrees.recette);
  else if (S.caisse === 'tickets') sum = plural(R.tickets.ventes, 'vente') + ' · ' + plural(R.tickets.cases, 'case') + ' · ' + money(R.tickets.recette);
  else sum = plural(R.boissons.commandes, 'commande') + ' · ' + plural(R.boissons.cases, 'case') + ' à barrer';
  html += '<div class="hsum"><strong>' + sum + '</strong>' + (nAnn ? '<span class="sub">' + nAnn + ' annulé' + (nAnn > 1 ? 's' : '') + ', non compté' + (nAnn > 1 ? 's' : '') + '</span>' : '') + '</div><div class="table">';
  all.slice().reverse().forEach(function (v) {
    var lines, pm = '', tt;
    if (v.type === 'prevente') { lines = ['Prévente QR' + (v.forcee ? ' <span class="pill warn">' + ({ format: 'QR non reconnu accepté', inconnu: 'hors liste, accepté' }[v.anomalie] || 'doublon accepté') + '</span>' : v.controle === 'liste' ? ' <span class="pill">liste ✓</span>' : ''), '<span class="sub" style="word-break:break-all">' + esc(v.code) + '</span>']; tt = '0 €'; pm = 'Prévente'; }
    else if (v.type === 'entree') { lines = v.lignes.map(function (l) { return l.quantite + ' × ' + esc(l.libelle); }); pm = payText(v.paiement); tt = money(v.total); }
    else if (v.type === 'ticket') { lines = [plural(v.cases, 'case') + ' (' + tkText(v.cases) + ')']; if (v.budget) lines.push('<span class="sub">budget ' + money(v.budget) + '</span>'); pm = payText(v.paiement); tt = money(v.total); }
    else { lines = v.lignes.map(function (l) { return l.quantite + ' × ' + esc(l.libelle) + (l.format === 'bouteille' ? ' (bouteille)' : '') + ' · ' + plural(l.totalCases, 'case'); }); pm = 'à barrer'; tt = plural(v.totalCases, 'case'); }
    var an = v.annulation;
    html += '<div class="sale' + (an ? ' cancelled' : '') + '"><span class="h">' + hhmm(v.horodatage) + '</span><div class="l">' + lines.map(function (x) { return '<span>' + x + '</span>'; }).join('') +
      (an ? '<span class="annul">Annulé à ' + hhmm(an.horodatage) + (an.motif ? ' · ' + esc(an.motif) : '') + '</span>' : '') + '</div>' +
      '<span class="pm">' + pm + '</span><span class="tt">' + tt + '</span><span class="act">' + (an ? '' : '<button class="btn btn-danger" data-a="askCancel" data-v="' + esc(night + '|' + v.id) + '">Annuler</button>') + '</span></div>';
  });
  return html + '</div></div>';
}

/* ---------- Bilan de la soirée ---------- */
function vBilan() {
  var nights = nightsList(Object.keys(S.imports)), night = S.bilanNight && nights.indexOf(S.bilanNight) >= 0 ? S.bilanNight : tonight();
  var R = summarize(bilanRecords(night)), pc = PC(), files = S.importFiles.filter(function (f) { return f.soiree === night; });
  var vip = (R.entrees.produits.vip || {}).quantite || 0, ecart = R.tickets.cases - R.boissons.cases;
  function kpi(lbl, val, small) { return '<div class="kpi"><span>' + lbl + '</span><b>' + val + '</b>' + (small ? '<small>' + small + '</small>' : '') + '</div>'; }
  var html = '<div class="full" data-caisse="boissons"><div class="header"><img src="' + LOGO_S + '" alt="Chlorophylle Night" data-a="goHome">' +
    '<h2 style="margin:0;font-size:' + (PHONE ? '18' : '22') + 'px;font-weight:800">Bilan</h2><div style="flex:1"></div>' +
    '<button class="btn" data-a="bilanBack" style="height:46px">← Retour</button></div><div class="bilan">';
  html += '<div class="hhead" style="margin:0 auto"><h2 style="margin:0;font-size:24px">' + nightLabel(night) + '</h2>' +
    (nights.length > 1 ? '<div class="hdays">' + nights.map(function (d) { return '<button class="choice' + (d === night ? ' on' : '') + '" data-a="bilanNight" data-v="' + d + '">' + (d === tonight() ? 'Ce soir' : frDate(d).slice(0, 5)) + '</button>'; }).join('') + '</div>' : '') + '</div>';
  html += '<div class="srcs">Données : <strong>cet appareil (' + esc(devName()) + ')</strong>' +
    (files.length ? ' + ' + files.map(function (f) { return '<strong>' + esc(f.appareilNom) + '</strong> (' + f.n + ')'; }).join(', ') : '') +
    '. Pour le bilan complet, chaque appareil envoie sa soirée sur GitHub (menu ⋮), puis « Charger depuis GitHub » ici. Sans réseau : exporter les fichiers et les importer.' +
    '<div class="actions" style="justify-content:flex-start;margin-top:10px">' +
    (ghConfigured() ? '<button class="btn btn-primary" data-a="ghLoad"' + (S.ghBusy ? ' disabled' : '') + '>' + (S.ghBusy === 'load' ? 'Chargement…' : 'Charger depuis GitHub') + '</button>' : '') +
    '<button class="btn" data-a="importFiles">Importer des fichiers</button>' +
    (S.importFiles.length ? '<button class="btn btn-danger" data-a="clearImports">Retirer les imports</button>' : '') +
    '<button class="btn" data-a="csv">Exporter le bilan (CSV)</button></div></div>';

  html += '<section class="sect"><h3><i style="background:var(--gold)"></i>Recette</h3><div class="bgrid">' +
    kpi('Total encaissé', money(R.recette)) + kpi('Cash', money(R.cash)) + kpi('Bancontact', money(R.bancontact)) +
    kpi('Entrées', money(R.entrees.recette)) + kpi('Tickets', money(R.tickets.recette)) + '</div></section>';

  html += '<section class="sect"><h3><i style="background:var(--gold)"></i>Entrées</h3><div class="bgrid">' +
    kpi('Entrées totales', R.entrees.personnes + R.entrees.preventes, 'payantes + préventes') +
    kpi('Entrées payantes', R.entrees.personnes, money(((R.entrees.produits.entree || {}).total) || 0)) +
    kpi('Préventes QR', R.entrees.preventes, R.entrees.forcees ? [['doublon', 'doublon'], ['format', 'QR non reconnu'], ['inconnu', 'hors liste']].filter(function (x) { return R.entrees.anomalies[x[0]]; }).map(function (x) { return R.entrees.anomalies[x[0]] + ' ' + x[1] + ' accepté' + (R.entrees.anomalies[x[0]] > 1 ? 's' : ''); }).join(', ') : 'aucune anomalie acceptée') +
    kpi('Tables VIP', vip, money(((R.entrees.produits.vip || {}).total) || 0)) + '</div></section>';

  html += '<section class="sect"><h3><i style="background:var(--leaf)"></i>Tickets</h3><div class="bgrid">' +
    kpi('Cases vendues', R.tickets.cases, money(R.tickets.cases * pc)) +
    kpi('Équivalent cartes', String(r2(R.tickets.cases / CPC())).replace('.', ','), 'de ' + CPC() + ' cases') +
    kpi('Cartes complètes', R.tickets.cartes, plural(R.tickets.casesSeules, 'case') + ' à l’unité') +
    kpi('Ventes', R.tickets.ventes, R.tickets.ventes ? 'moy. ' + String(r2(R.tickets.cases / R.tickets.ventes)).replace('.', ',') + ' cases' : '') + '</div></section>';

  html += '<section class="sect"><h3><i style="background:var(--mint)"></i>Boissons</h3><div class="bgrid">' +
    kpi('Commandes', R.boissons.commandes) + kpi('Cases barrées', R.boissons.cases, 'valeur ' + money(R.boissons.cases * pc)) +
    kpi('Cases non barrées', ecart, ecart >= 0 ? 'vendues − barrées (cartes encore en poche)' : 'plus barrées que vendues : fichiers manquants ?') + '</div>';
  var prods = Object.keys(R.boissons.produits).map(function (k) { return R.boissons.produits[k]; });
  if (prods.length) {
    var max = Math.max.apply(null, prods.map(function (p) { return p.quantite; }));
    html += '<div style="height:12px"></div><table class="btable"><thead><tr><th>Boisson</th><th class="n">Qté</th><th class="hide-phone" style="width:30%"></th><th class="n">Cases</th><th class="n hide-phone">Valeur</th></tr></thead><tbody>';
    CATALOGUE.boissons.map(function (k) { return k.nom; }).concat(Object.keys(R.boissons.categories)).filter(function (v, i, a) { return a.indexOf(v) === i && R.boissons.categories[v]; }).forEach(function (cn) {
      var kc = R.boissons.categories[cn];
      html += '<tr class="cat"><td>' + esc(cn) + '</td><td class="n">' + kc.quantite + '</td><td class="hide-phone"></td><td class="n">' + kc.cases + '</td><td class="n hide-phone">' + money(kc.cases * pc) + '</td></tr>';
      prods.filter(function (p) { return p.categorie === cn; }).sort(function (a, b) { return b.quantite - a.quantite; }).forEach(function (p) {
        html += '<tr><td>' + esc(p.libelle) + (p.format === 'bouteille' ? ' <span class="pill">bouteille</span>' : '') + '</td><td class="n">' + p.quantite + '</td>' +
          '<td class="hide-phone"><div class="bar"><i style="width:' + Math.round(p.quantite * 100 / max) + '%"></i></div></td><td class="n">' + p.cases + '</td><td class="n hide-phone">' + money(p.cases * pc) + '</td></tr>';
      });
    });
    html += '</tbody></table>';
  } else html += '<div class="sub" style="margin-top:10px">Aucune commande enregistrée pour cette soirée.</div>';
  html += '</section>';

  var hs = Object.keys(R.heures).map(Number).sort(function (a, b) { return (a < 12 ? a + 24 : a) - (b < 12 ? b + 24 : b); });
  if (hs.length) {
    var mx = 1; hs.forEach(function (h) { mx = Math.max(mx, R.heures[h].entrees, R.heures[h].commandes); });
    html += '<section class="sect"><h3><i style="background:var(--text)"></i>Activité par heure</h3><div class="hours">' + hs.map(function (h) {
      var b = R.heures[h];
      return '<div class="hcol" title="' + h + ' h : ' + b.entrees + ' entrées, ' + b.commandes + ' commandes"><div class="bars"><i style="height:' + Math.round(b.entrees * 100 / mx) + '%;background:var(--gold)"></i><i style="height:' + Math.round(b.commandes * 100 / mx) + '%;background:var(--mint)"></i></div><span>' + h + 'h</span></div>';
    }).join('') + '</div><div class="legend"><span><i style="background:var(--gold)"></i>Entrées (payantes + préventes)</span><span><i style="background:var(--mint)"></i>Commandes boissons</span></div></section>';
  }
  return html + '</div></div>';
}

/* ---------- Fenêtres ---------- */
function vPay() {
  var t = payTotal(), rec = num(S.received), ch = rec - t, mixC = num(S.mix);
  var can = S.payMode === 'cash' ? rec >= t - 0.001 : S.payMode === 'mix' ? (mixC > 0 && mixC < t) : true;
  var what = S.caisse === 'entrees' ? S.cartE.map(function (l) { return l.qty + ' × ' + esc(l.libelle); }).join(', ') : plural(S.tk.cases, 'case') + ' (' + tkText(S.tk.cases) + ')';
  var html = '<div class="overlay"><div class="modal paymodal" style="width:min(640px,96vw)" data-caisse="' + S.caisse + '"><div class="row"><div><h2>Encaissement</h2><div class="sub">' + what + '</div></div><span style="font-size:40px;font-weight:800">' + money(t) + '</span></div>' +
    '<div class="modes"><button class="mode' + (S.payMode === 'cash' ? ' on' : '') + '" data-a="mode" data-v="cash">Cash</button><button class="mode' + (S.payMode === 'bc' ? ' on' : '') + '" data-a="mode" data-v="bc">Bancontact</button><button class="mode' + (S.payMode === 'mix' ? ' on' : '') + '" data-a="mode" data-v="mix">Mixte</button></div>';
  var body;
  if (S.payMode === 'cash') {
    body = '<div class="sub" style="font-weight:700">Billets reçus</div><div class="bills">' +
      BILLS.map(function (b) { return '<button class="bill" data-a="bill" data-v="' + b + '">' + b + ' €</button>'; }).join('') + '<button class="bill exact" data-a="exact">Montant exact</button></div>' +
      '<div style="display:flex;gap:12px;align-items:flex-end"><label class="f" style="flex:1">Montant reçu (€)<input type="text" inputmode="decimal" data-f="received" value="' + esc(S.received) + '" placeholder="0" autocomplete="off"></label><button class="btn btn-danger" data-a="resetReceived">Effacer</button></div>' +
      '<div class="result' + (ch >= -0.001 ? '' : ' ko') + '"><b>' + (ch >= -0.001 ? 'À rendre' : 'Il manque') + '</b><span>' + money(Math.abs(ch)) + '</span></div>';
  } else if (S.payMode === 'bc') {
    body = '<div class="result" style="display:block;font-size:18px;line-height:1.5">Encaissez <strong style="white-space:nowrap;font-size:1.25em">' + money(t) + '</strong> sur le terminal, puis validez.</div>';
  } else {
    body = '<div class="sub" style="font-weight:700">Billets reçus (part cash)</div><div class="bills">' +
      BILLS.map(function (b) { return '<button class="bill" data-a="bill" data-v="' + b + '">' + b + ' €</button>'; }).join('') + '<button class="bill" data-a="resetMix" style="font-size:15px;color:var(--red)">Effacer</button></div>' +
      '<label class="f">Part payée en cash (€)<input type="text" inputmode="decimal" data-f="mix" value="' + esc(S.mix) + '" placeholder="0" autocomplete="off"></label>' +
      (mixC >= t - 0.001 && mixC > 0 ? '<div class="result ko"><b>Le cash couvre tout</b><span style="font-size:18px">Choisissez « Cash »</span></div>'
        : '<div class="result"><b>Reste en Bancontact</b><span>' + money(Math.max(0, t - mixC)) + '</span></div>');
  }
  html += '<div class="paybody' + (S.payMode === 'bc' ? ' mid' : '') + '">' + body + '</div>';
  return html + '<div class="actions"><button class="btn" data-a="close" style="height:60px">Retour</button><button class="btn btn-primary" data-a="validate" style="height:60px;font-size:20px;padding:0 36px"' + (can ? '' : ' disabled') + '>Valider la vente</button></div></div></div>';
}

function vScan() {
  var s = S.scan || {}, msg = '';
  if (s.state === 'ok') msg = '<div class="scanmsg ok"><big>✓ ' + (s.forcee ? 'Entrée acceptée' : 'Prévente valide') + '</big><code>' + esc(s.code) + '</code><span>Entrée enregistrée' +
    (s.forcee ? '' : s.controle === 'liste' ? ' · billet trouvé dans la liste' : s.controle === 'format' ? ' · QR officiel (format)' : '') + '</span></div>';
  else if (s.state === 'format') msg = '<div class="scanmsg dup"><big>✗ QR non reconnu</big><code>' + esc(String(s.raw).slice(0, 160)) + '</code><span>Ce n\u2019est pas un QR de prévente officiel Chlorophylle Night</span></div>';
  else if (s.state === 'inconnu') msg = '<div class="scanmsg dup"><big>✗ Billet inconnu</big><code>' + esc(s.code) + '</code><span>QR au bon format mais <strong>absent de la liste</strong> des préventes vendues</span></div>';
  else if (s.state === 'dup') msg = '<div class="scanmsg dup"><big>✗ Déjà scannée</big><code>' + esc(s.code) + '</code><span>Première entrée ' + (s.prev.soiree !== tonight() ? 'le ' + frDate(s.prev.soiree) + ' ' : '') + 'à <strong>' + hhmm(s.prev.horodatage) + '</strong>' + (s.prev.appareil ? ' (' + esc(s.prev.appareil.nom) + ')' : '') + '</span></div>';
  else if (s.cam === 'nodet') msg = '<div class="scanmsg info">La lecture des QR codes n’est pas disponible dans ce navigateur.<br>Utilisez Chrome sur la tablette, ou saisissez le code ci-dessous.</div>';
  else if (s.cam === 'denied') msg = '<div class="scanmsg info">Caméra inaccessible.<br>Autorisez la caméra pour cette app (icône à gauche de l’adresse dans Chrome), ou saisissez le code ci-dessous.</div>';
  else if (s.cam === 'starting') msg = '<div class="scanmsg info">Démarrage de la caméra…</div>';
  var acts = s.state === 'dup' || s.state === 'format' || s.state === 'inconnu'
    ? '<button class="btn" data-a="scanForce" style="border-color:var(--amber);color:var(--amber)">Laisser entrer quand même</button><button class="btn btn-primary" data-a="scanRefuse" style="background:var(--red);color:#fff">Refuser · scanner le suivant</button>'
    : s.state === 'ok' ? '<button class="btn btn-primary" data-a="scanNext">Scanner le suivant</button>' : '';
  var n = summarize(recs(tonight())).entrees.preventes;
  return '<div class="overlay"><div class="modal" style="width:min(640px,96vw)" data-caisse="entrees"><div class="row"><div><h2>Prévente QR</h2><div class="sub">' + plural(n, 'prévente') + ' ce soir sur cet appareil</div></div><button class="btn" data-a="close">Fermer</button></div>' +
    '<div class="scanbox"><div id="camslot"></div>' + (s.cam === 'on' && s.state === 'live' ? '<div class="scanframe"></div>' : '') + msg + '</div>' +
    (acts ? '<div class="actions">' + acts + '</div>' : '') +
    '<div style="display:flex;gap:10px;align-items:flex-end"><label class="f" style="flex:1">Ou saisir le code du billet<input type="text" data-f="scanCode" value="' + esc(S.scanCode || '') + '" placeholder="code de la prévente" autocomplete="off" autocapitalize="none" spellcheck="false"></label>' +
    '<button class="btn" data-a="scanManual"' + ((S.scanCode || '').trim() && s.state !== 'dup' ? '' : ' disabled') + '>Valider</button></div>' +
    '<div class="row" style="padding:10px 14px;border:1px solid var(--line2);border-radius:12px;flex-wrap:wrap"><span class="sub" style="font-weight:700">' + plistLabel() + '</span></div>' +
    '<div class="sub">Le contrôle des doublons porte sur les préventes scannées sur <strong>cet appareil</strong>. Avec deux appareils à l’entrée, un même billet pourrait passer une fois sur chacun.</div></div></div>';
}

function vOkB() {
  var n = S.okCases, cpc = CPC(), c = Math.floor(n / cpc), r = n % cpc;
  function box(v, l) { return '<div class="result" style="flex:1;display:flex;flex-direction:column;gap:2px;padding:12px"><span style="font-size:40px;font-weight:800;line-height:1">' + v + '</span><b style="font-size:15px">' + l + '</b></div>'; }
  return '<div class="overlay"><div class="modal" style="width:min(480px,96vw);align-items:center;text-align:center" data-caisse="boissons">' +
    '<div class="sub" style="font-weight:700">Commande enregistrée</div>' +
    '<div class="bigok"><b>' + n + '</b><span>' + (n > 1 ? 'cases à barrer' : 'case à barrer') + '</span></div>' +
    '<div style="display:flex;align-items:center;gap:10px;width:100%">' + box(c, c > 1 ? 'cartes pleines' : 'carte pleine') + '<span style="font-size:28px;font-weight:800">+</span>' + box(r, r > 1 ? 'cases en plus' : 'case en plus') + '</div>' +
    '<div class="sub" style="font-size:14px">carte pleine = ' + cpc + ' cases</div>' +
    '<div class="sub" style="line-height:1.5">' + (S.okLines || []).map(function (l) { return l.quantite + ' × ' + esc(l.libelle) + (l.format === 'bouteille' ? ' (bouteille)' : ''); }).join(' · ') + '</div>' +
    '<button class="btn btn-primary" data-a="close" style="width:100%;height:60px;font-size:20px">OK · nouvelle commande</button></div></div>';
}

function vCancel() {
  var p = (S.cancelRef || '').split('|'), v = recs(p[0]).filter(function (x) { return x.id === p[1]; })[0];
  if (!v) return '';
  var desc = v.type === 'prevente' ? 'Prévente ' + esc(v.code) : v.type === 'commande' ? v.lignes.map(function (l) { return l.quantite + ' × ' + esc(l.libelle); }).join(', ') + ' · ' + plural(v.totalCases, 'case')
    : v.type === 'ticket' ? plural(v.cases, 'case') + ' · ' + money(v.total) : v.lignes.map(function (l) { return l.quantite + ' × ' + esc(l.libelle); }).join(', ') + ' · ' + money(v.total);
  var p2 = v.paiement;
  return '<div class="overlay"><div class="modal"><h2>Annuler cet enregistrement ?</h2>' +
    '<div class="result" style="display:block;line-height:1.5"><strong>' + frDate(p[0]) + ' à ' + hhmm(v.horodatage) + '</strong><br>' + desc + '</div>' +
    '<label class="f">Motif (facultatif)<input type="text" data-f="cancelMotif" value="' + esc(S.cancelMotif || '') + '" placeholder="ex. erreur de saisie" autocomplete="off"></label>' +
    '<div class="sub">Il reste visible dans l’historique et dans l’export, marqué « annulé », mais n’est plus compté. ' +
    (p2 && p2.cash > 0 ? 'Pensez à rendre <strong>' + money(p2.cash) + '</strong> en cash si le client est remboursé. ' : '') +
    (p2 && p2.bancontact > 0 ? 'Un paiement Bancontact se rembourse sur le terminal. ' : '') + 'Cette action ne peut pas être défaite.</div>' +
    '<div class="actions"><button class="btn" data-a="close">Retour</button><button class="btn" data-a="doCancel" style="background:var(--red);border-color:var(--red);color:#fff">Annuler l’enregistrement</button></div></div></div>';
}

function vDevice() {
  return '<div class="overlay"><div class="modal"><h2>Nom de l’appareil</h2>' +
    '<div class="sub">Sert à reconnaître les fichiers exportés et le bilan (ex. « Entrée », « Caisse tickets », « Bar 1 »). Identifiant technique : ' + esc(DEV.id) + '.</div>' +
    '<label class="f">Nom<input type="text" data-f="devName" value="' + esc(S.devName || '') + '" placeholder="Appareil ' + esc(DEV.id) + '" autocomplete="off" maxlength="30"></label>' +
    '<div class="actions"><button class="btn" data-a="close">Annuler</button><button class="btn btn-primary" data-a="saveDevice">Enregistrer</button></div></div></div>';
}

function vGhCfg() {
  var m = S.ghMsg;
  var body = ghReady()
    ? '<div class="sub" style="font-size:15px;line-height:1.5">L’envoi est déverrouillé sur cet appareil (dépôt <strong>' + esc(GH_REPO) + '</strong>, dossier <strong>' + esc(GH_DOSSIER) + '</strong>, appareil <strong>' + esc(devName()) + '</strong>). Rien ne part sans un appui sur « Envoyer ». Verrouiller efface le jeton de cet appareil.</div>'
    : '<div class="sub" style="font-size:15px;line-height:1.5">Saisissez la <strong>phrase de passe des caisses</strong> (la même que pour la Caisse Bar et la Caisse Sapins). Elle n’est demandée qu’une fois sur cet appareil et n’est jamais enregistrée.</div>' +
      '<label class="f">Phrase de passe<input type="password" data-f="ghPass" value="' + esc(S.ghPass || '') + '" autocomplete="off" autocapitalize="none" spellcheck="false"></label>';
  return '<div class="overlay"><div class="modal" style="width:min(600px,96vw)"><h2>Envoi des ventes sur GitHub</h2>' + body +
    (m ? '<div class="result' + (m.ok === false ? ' ko' : '') + '" style="display:block;font-size:15px;line-height:1.45">' + esc(m.text) + '</div>' : '') +
    '<div class="actions"><button class="btn" data-a="close">Fermer</button>' +
      (ghReady() ? '<button class="btn btn-danger" data-a="ghLock">Verrouiller cet appareil</button><button class="btn btn-primary" data-a="ghTest">Tester l’accès</button>'
                 : '<button class="btn btn-primary" data-a="ghUnlock">Déverrouiller</button>') + '</div></div></div>';
}
function vGhRes() {
  var r = S.ghResult || {};
  return '<div class="overlay"><div class="modal" style="width:min(520px,96vw)"><h2 style="color:var(--red)">' + esc(r.titre || 'Envoi impossible') + '</h2>' +
    '<div style="font-size:17px;line-height:1.5">' + esc(r.text || '') + '</div>' +
    '<div class="sub">' + (r.lecture ? 'Vous pouvez réessayer plus tard ou importer les fichiers exportés.' : 'Les données restent enregistrées sur l’appareil. Réessayez plus tard ou utilisez l’export en fichier.') + '</div>' +
    '<div class="actions"><button class="btn btn-primary" data-a="close">OK</button></div></div></div>';
}
function vTestDelQ() {
  var n = countQ();
  return '<div class="overlay"><div class="modal" style="width:min(520px,96vw)"><h2 style="color:var(--red)">TEST · Effacer les préventes scannées</h2>' +
    '<div style="font-size:17px;line-height:1.5">Efface <strong>' + plural(n, 'prévente') + '</strong> enregistrée' + (n > 1 ? 's' : '') + ' sur cet appareil (toutes les soirées). Les mêmes QR codes pourront être scannés à nouveau.</div>' +
    '<div class="sub">Fonction de test : les entrées payantes, tickets et commandes ne sont pas touchés. Les préventes effacées disparaissent de l\u2019historique et des prochains envois. À retirer avant la soirée.</div>' +
    '<div class="actions"><button class="btn" data-a="close">Annuler</button><button class="btn" data-a="testDelQGo" style="background:var(--red);border-color:var(--red);color:#fff"' + (n ? '' : ' disabled') + '>Effacer ' + plural(n, 'prévente') + '</button></div></div></div>';
}
function vStorageBar() {
  if (S.usedPct < 80) return '';
  return '<button class="memwarn" data-a="showDays">⚠ Mémoire de l’appareil pleine à ' + S.usedPct + ' % : touchez ici pour effacer les anciennes soirées exportées</button>';
}
function vStorage() {
  return '<div class="overlay"><div class="modal" style="width:min(600px,96vw)"><h2 style="color:var(--red)">Mémoire pleine : enregistrement impossible</h2>' +
    (S.storageMsg ? '<div class="result ko" style="display:block;font-size:18px;font-weight:800">' + esc(S.storageMsg) + '</div>' : '') +
    '<div style="font-size:17px;line-height:1.5">L’appareil n’a plus de place. Les données restent disponibles <strong>tant que l’app reste ouverte</strong>.<br><strong>1.</strong> Exportez tout de suite la soirée.<br><strong>2.</strong> Effacez les anciennes soirées déjà exportées.</div>' +
    '<div class="actions"><button class="btn" data-a="close">Fermer</button><button class="btn" data-a="showDays">Effacer d’anciennes soirées</button><button class="btn btn-primary" data-a="download">Exporter la soirée</button></div></div></div>';
}
function vDays() {
  var dates = Object.keys(S.nights).filter(function (d) { return S.nights[d] && S.nights[d].length; }).sort().reverse();
  var rows = dates.map(function (d) {
    var R = summarize(S.nights[d]), isT = d === tonight();
    return '<div class="row" style="padding:12px 4px;border-bottom:1px solid var(--soft);flex-wrap:wrap">' +
      '<div style="display:flex;flex-direction:column;gap:2px"><strong style="font-size:18px">' + nightLabel(d) + (isT ? ' <span class="sub">(ce soir)</span>' : '') + '</strong>' +
      '<span class="sub">' + (GH.envois[d] ? 'Envoyée sur GitHub le ' + frDate(GH.envois[d]).slice(0, 5) + ' à ' + hhmm(GH.envois[d]) + ' · ' : '') + money(R.recette) + ' · ' + (R.entrees.personnes + R.entrees.preventes) + ' entrées · ' + R.tickets.cases + ' cases vendues · ' + R.boissons.commandes + ' commandes</span></div>' +
      '<div class="dayact">' + (isT ? '' : !S.exported[d] ? '<span class="sub">Pas encore exportée</span>'
        : S.confirmDel === d ? '<button class="btn btn-danger" data-a="delDay" data-v="' + d + '" style="border:1px solid var(--red)">Confirmer</button>'
        : '<button class="btn btn-danger" data-a="askDel" data-v="' + d + '">Effacer</button>') +
      (ghConfigured() ? '<button class="btn" data-a="ghSend" data-v="' + d + '"' + (S.ghBusy ? ' disabled' : '') + '>' + (S.ghBusy === d ? 'Envoi…' : GH.envois[d] ? 'Renvoyer sur GitHub' : 'Envoyer sur GitHub') + '</button>' : '') +
      '<button class="btn" data-a="download" data-v="' + d + '">Télécharger</button></div></div>';
  }).join('');
  return '<div class="overlay"><div class="modal" style="width:min(680px,96vw);max-height:90%"><div class="row"><h2>Soirées enregistrées</h2><button class="btn" data-a="close">Fermer</button></div>' +
    '<div class="memgauge"><div class="row"><span>Mémoire de l’appareil</span><strong' + (S.usedPct >= 80 ? ' style="color:var(--red)"' : '') + '>' + storageMo(storageUsed()) + ' sur ' + storageMo(STORAGE_LIMIT) + ' (' + S.usedPct + ' %)</strong></div>' +
    '<div class="bar"><i style="width:' + Math.min(100, S.usedPct) + '%"></i></div></div>' +
    '<div class="sub">Une soirée ne peut être effacée qu’après avoir été téléchargée ou envoyée sur GitHub. La soirée en cours ne peut pas être effacée.</div>' +
    '<div>' + (rows || '<div class="empty">Aucune donnée enregistrée</div>') + '</div></div></div>';
}
function vImport() {
  var im = S.importing;
  if (im.error) return '<div class="overlay"><div class="modal"><h2>Catalogue non valide</h2><div class="result ko" style="display:block;font-size:16px">' + esc(im.error) + '</div>' +
    '<div class="sub">Le catalogue actuel reste en place.</div><div class="actions"><button class="btn" data-a="close">Fermer</button></div></div></div>';
  var c = im.cat;
  return '<div class="overlay"><div class="modal"><h2>Nouveau catalogue disponible</h2><div class="sub">Installé actuellement : ' + esc(catalogueLabel(CATALOGUE)) + '</div>' +
    '<div style="display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--line2);border-radius:12px"><strong style="font-size:18px">' + esc(catalogueLabel(c)) + '</strong>' +
    '<span class="sub">Entrées : ' + c.entrees.map(function (e) { return esc(e.libelle) + ' ' + money(e.prix); }).join(' · ') + '</span>' +
    '<span class="sub">Tickets : ' + money(c.tickets.prixCase) + ' la case, cartes de ' + c.tickets.casesParCarte + ' cases</span>' +
    '<span class="sub">Boissons : ' + c.boissons.map(function (k) { return esc(k.nom) + ' (' + k.produits.length + ')'; }).join(' · ') + '</span></div>' +
    ((S.cartE.length || S.cartB.length || S.tk.cases) ? '<div class="result ko" style="font-size:15px;font-weight:700">Les paniers en cours seront vidés.</div>' : '') +
    '<div class="sub">Ce qui est déjà enregistré ne change pas.</div>' +
    '<div class="actions"><button class="btn" data-a="close">Plus tard</button><button class="btn btn-primary" data-a="installCatalogue">Installer</button></div></div></div>';
}

/* ---------- Rendu ---------- */
var app = document.getElementById('app');
function render() {
  var act = document.activeElement, f = act && act.dataset ? act.dataset.f : null, pos = f ? act.selectionStart : null;
  if (VIDEO.parentNode !== CAMHOLD) CAMHOLD.appendChild(VIDEO); // la vidéo survit au rendu
  var html = S.screen === 'home' ? vHome() : S.screen === 'bilan' ? vBilan() : vPos();
  var M = { testDelQ: vTestDelQ, plist: vPlist, ghcfg: vGhCfg, ghres: vGhRes, pay: vPay, scan: vScan, okB: vOkB, cancel: vCancel, device: vDevice, storage: vStorage, days: vDays, import: vImport };
  if (S.storageMsg && !S.modal) S.modal = 'storage';
  if (S.modal && M[S.modal]) html += M[S.modal]();
  if (S.toast) html += '<div class="toast">' + esc(S.toast) + '</div>';
  app.innerHTML = html;
  var slot = app.querySelector('#camslot');
  if (slot) { slot.appendChild(VIDEO); if (VIDEO.srcObject) VIDEO.play().catch(function () {}); }
  if (f) { var el = app.querySelector('[data-f="' + f + '"]'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} } }
}
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  if (el.classList.contains('overlay') && e.target !== el) return; // clic dans la fenêtre, pas à côté
  var fn = A[el.dataset.a]; if (!fn) return;
  fn(el.dataset.v); render(); reloadIfIdle();
});
document.addEventListener('input', function (e) {
  var f = e.target.dataset && e.target.dataset.f;
  if (f) { S[f] = e.target.value; render(); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.f === 'scanCode') { A.scanManual(); render(); }
});

/* Catalogue : catalogue.json à côté de index.html */
function loadSiteCatalogue(manual) {
  if (manual && navigator.onLine === false) { toast('Pas de réseau : impossible de vérifier le catalogue'); render(); return; }
  S.catLoading = true; render();
  fetch('catalogue.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (raw) {
      S.catLoading = false;
      var cat;
      try { cat = normalizeCatalogue(raw); } catch (err) { S.importing = { error: err.message }; S.modal = 'import'; render(); return; }
      if (CATALOGUE.integre && !localStorage.getItem(CAT_KEY)) {
        try { localStorage.setItem(CAT_KEY, JSON.stringify(raw)); } catch (e) {}
        CATALOGUE = cat; S.bcat = cat.boissons[0].id;
      } else if (JSON.stringify(raw) !== localStorage.getItem(CAT_KEY)) {
        S.siteUpdate = { raw: raw, cat: cat };
        if ((manual || S.screen === 'home') && !S.modal) { S.importing = S.siteUpdate; S.modal = 'import'; }
      } else { S.siteUpdate = null; if (manual) toast('Le catalogue est à jour (' + catalogueLabel(CATALOGUE) + ')'); }
      render();
    })
    .catch(function () { S.catLoading = false; if (manual) toast('Pas de réseau : impossible de vérifier le catalogue'); render(); });
}
render();
if (location.protocol !== 'file:') loadSiteCatalogue(false);
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
/* Mise à jour de l'app : le nouveau service worker prend la main dès qu'il est installé ;
   la page se recharge alors toute seule, tout de suite sur l'accueil, sinon au prochain retour à l'accueil (jamais pendant une vente). */
var UPDATE_READY = false;
function reloadIfIdle() { if (UPDATE_READY && S.screen === 'home' && !S.modal && !S.cartE.length && !S.cartB.length && !S.tk.cases) location.reload(); }
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (!hadController) { hadController = true; return; } UPDATE_READY = true; reloadIfIdle(); });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update().catch(function () {}); });
  }).catch(function () {});
}
})();
</script>
</body>
</html>
